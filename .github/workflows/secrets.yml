name: Secret detection

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      # fetch-depth: 0 => tout l'historique, pas seulement le dernier commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Binaire officiel (licence MIT) plutôt que gitleaks-action, qui exige
      # une licence pour les dépôts d'organisation.
      - name: Install Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          ./gitleaks version

      - name: Scan full Git history
        run: |
          mkdir -p build/reports
          ./gitleaks git . --config .gitleaks.toml --redact --verbose \
            --report-format sarif --report-path build/reports/gitleaks.sarif

      # Le rapport est expurgé (--redact) : il ne contient pas la valeur du secret.
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: build/reports/gitleaks.sarif
          retention-days: 7
          if-no-files-found: warn
